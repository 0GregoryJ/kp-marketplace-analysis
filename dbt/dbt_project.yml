name: 'kp_analysis'
version: '1.0.0'

profile: 'kp_analysis'

model-paths: ["models"]

models:
  kp_analysis:
    staging:
      +materialized: table
      cms:
        +schema: staging
      bls:
        +schema: staging
      covered_ca:
        +schema: staging
      census:
        +schema: staging

    intermediate:
      +materialized: table
      +schema: intermediate

    marts:
      +materialized: table
      +schema: marts

seeds:
  kp_analysis:
    +schema: reference

    dim_county:
      +column_types:
        state_code: varchar
        state_fips: varchar
        county_name: varchar
        county_fips: varchar

    dim_county_rating_area:
      +column_types:
        county_fips: varchar
        rating_area_id: varchar